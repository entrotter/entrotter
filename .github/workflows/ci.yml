name: Workspace integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: entrotter/entrotter
          path: entrotter
      - uses: actions/checkout@v4
        with:
          repository: entrotter/engine
          ref: bb8b3e8d32c7cbd49629d337758f30bfdf805045
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: entrotter/sdk-python
          ref: f65f45de26c2658e2269a02a5dbe7c90c74b1cba
          path: sdk-python
      - uses: actions/checkout@v4
        with:
          repository: entrotter/cli
          ref: b6a7f4d96cec08f4779968b9f63bab3f9b405fe8
          path: cli
      - uses: actions/checkout@v4
        with:
          repository: entrotter/scenarios
          ref: 5b718984ac67b8fb49e02f4dab676ae212d2aa58
          path: scenarios
      - uses: actions/checkout@v4
        with:
          repository: entrotter/entrotter.github.io
          ref: ab121348b0ffbec5650f9eadf0a0b11f639d9780
          path: entrotter.github.io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scenarios/requirements-dev.txt
      - run: python entrotter/scripts/verify.py --require-anvil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: entrotter/evidence/
  host-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: entrotter
      - uses: actions/checkout@v4
        with:
          repository: entrotter/engine
          ref: 80e8ce2386812daa8f6150048f84ab316624cc0d
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: entrotter/sdk-python
          ref: f65f45de26c2658e2269a02a5dbe7c90c74b1cba
          path: sdk-python
      - uses: actions/checkout@v4
        with:
          repository: entrotter/cli
          ref: d842c56bd9cf2c0845f5666b4ea0b02d2be34489
          path: cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Verify CLI-SDK-API success, quota errors and connection recovery
        run: PYTHONPATH=engine/src:sdk-python/src:cli/src python entrotter/scripts/check_host_limits.py --output entrotter/evidence/host-limits-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: host-limits-evidence
          path: entrotter/evidence/host-limits-ci.json
          if-no-files-found: error
