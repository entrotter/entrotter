name: Workspace integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: entrotter/entrotter
          path: entrotter
      - uses: actions/checkout@v4
        with:
          repository: entrotter/engine
          ref: bb8b3e8d32c7cbd49629d337758f30bfdf805045
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: entrotter/sdk-python
          ref: f65f45de26c2658e2269a02a5dbe7c90c74b1cba
          path: sdk-python
      - uses: actions/checkout@v4
        with:
          repository: entrotter/cli
          ref: b6a7f4d96cec08f4779968b9f63bab3f9b405fe8
          path: cli
      - uses: actions/checkout@v4
        with:
          repository: entrotter/scenarios
          ref: 5b718984ac67b8fb49e02f4dab676ae212d2aa58
          path: scenarios
      - uses: actions/checkout@v4
        with:
          repository: entrotter/entrotter.github.io
          ref: ab121348b0ffbec5650f9eadf0a0b11f639d9780
          path: entrotter.github.io
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scenarios/requirements-dev.txt
      - run: python entrotter/scripts/verify.py --require-anvil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: entrotter/evidence/
  host-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: entrotter
      - uses: actions/checkout@v4
        with:
          repository: entrotter/engine
          ref: 80e8ce2386812daa8f6150048f84ab316624cc0d
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: entrotter/sdk-python
          ref: b0c2ba3bba411e548af44101ae06e879bd7b5dc0
          path: sdk-python
      - uses: actions/checkout@v4
        with:
          repository: entrotter/cli
          ref: aba6a6147b2b4b96facf758f9b95b63d8e6b5952
          path: cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - name: Verify CLI-SDK-API success, quota errors and connection recovery
        run: PYTHONPATH=engine/src:sdk-python/src:cli/src python entrotter/scripts/check_host_limits.py --output entrotter/evidence/host-limits-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: host-limits-evidence
          path: entrotter/evidence/host-limits-ci.json
          if-no-files-found: error
  bounded-default:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: engine/src:sdk-python/src:cli/src
      ENTROTTER_DOCKER_SOCKET: /var/run/docker.sock
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: entrotter
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/engine
          ref: dddba4a2c3efdd429e36520e8fc9d163888089e2
          path: engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/sdk-python
          ref: b0c2ba3bba411e548af44101ae06e879bd7b5dc0
          path: sdk-python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: entrotter/cli
          ref: 952bfb5aba14b674dd959035a5625fadbd2b07d1
          path: cli
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build source-bound local image
        run: |
          mkdir -p entrotter/evidence/bounded-default/ci
          python engine/scripts/build_worker.py --output entrotter/evidence/bounded-default/ci/image.json
          python - <<'PY'
          import json, os
          image = json.load(open('entrotter/evidence/bounded-default/ci/image.json'))['image_id']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ENTROTTER_WORKER_IMAGE=' + image + '\n')
          PY
      - name: Verify default local CLI and CLI-SDK-API, failure preservation and quotas
        run: python entrotter/scripts/check_host_limits.py --worker-manifest entrotter/evidence/bounded-default/ci/image.json --output entrotter/evidence/bounded-default/ci/integration.json
      - name: Measure a clean public checkout with the bounded default
        run: python entrotter/scripts/reproduce_clean.py --bounded
      - name: Verify no owned worker remains
        if: always()
        run: |
          workers=$(docker ps --all --filter label=org.entrotter.worker=true --format '{{.ID}}')
          test -z "$workers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-default-evidence
          path: |
            entrotter/evidence/bounded-default/ci/
            entrotter/evidence/clean-bounded-reproduction.json
          if-no-files-found: error
