name: Selective social publishing

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only eligibility check (no network writes)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: entrotter-social-publisher
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.repository == 'entrotter/entrotter' && github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/social_publish.py --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
          TYPEFULLY_QUEUE_READY: ${{ vars.TYPEFULLY_QUEUE_READY }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
  publish:
    if: github.repository == 'entrotter/entrotter' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/social_publish.py
        env:
          GH_TOKEN: ${{ github.token }}
          TYPEFULLY_QUEUE_READY: ${{ vars.TYPEFULLY_QUEUE_READY }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
