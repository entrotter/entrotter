name: Social post candidate
description: Propose a verifiable milestone worth one of at most ten monthly posts.
title: '[Social] '
labels: ['social:candidate']
body:
  - type: markdown
    attributes:
      value: |
        Slots are scarce, not a target. English, technically precise single posts only.
        No routine commits, dependency/CI/typo fixes, internal refactors, generic promotion,
        or invented results. Never include secrets. A maintainer reviews evidence and
        adds social:approved last. Any later edit requires removing and re-adding approval.
        Keep the generated section headings unchanged; enter plain text, not code fences.
  - type: textarea
    id: post-copy
    attributes:
      label: Post copy
      description: Exact single X post; normally English, at most 280 weighted characters, preferably one link or fewer.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this deserves one of the monthly slots
      description: Explain the meaningful release, working demo, capability, reproducibility result, tutorial, milestone, contributor opportunity, or technical insight.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence/source URL
      description: Public HTTPS source substantiating the copy. Review pending versus merged/deployed status accurately.
    validations:
      required: true
  - type: input
    id: timing
    attributes:
      label: Preferred timing
      description: Optional editorial note; automation always uses Typefully's next free queue slot. Hold approval until ready.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional context for the reviewer; never posted.
